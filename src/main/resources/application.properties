spring.application.name=url-shortener
server.port=8080

# PostgreSQL connection (override with env vars DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the "urls" table automatically. Switch to Flyway/Liquibase later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Expired links stop redirecting right away; they are deleted after this many days.
app.expired-retention-days=30
# Cleanup runs daily at 03:00.
app.cleanup-cron=0 0 3 * * *
